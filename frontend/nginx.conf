server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 纯静态托管 ----------
    # 本容器只做 SPA 静态托管，不含任何 API 反代块。
    # 浏览器对 /whatsinthebox、/uploads 的请求是「域名根绝对路径」，直接打到宿主机
    # 外层 nginx，由外层 location ^~ 保留前缀直连后端容器 172.19.0.2:8004，
    # 前端容器永远收不到这两个路径，故原有反代块属死代码，已删除。
    #
    # 外层对 /2026trip/、/_wb/ 采用「剥离前缀」转发（proxy_pass 带尾斜杠），
    # 因此本容器始终按根 / 提供服务，回退逻辑与单域名部署完全一致。

    # ---------- 带 hash 的静态资源：长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA history 回退（必须放在最后） ----------
    # 未命中真实文件的路径全部回退 index.html，由 vue-router 按 pathname 接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 基础 gzip ----------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
