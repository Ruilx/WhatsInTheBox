# ============================================================================
# 宿主机（外层）nginx 反向代理配置 —— 由 WhatsInTheBox（箱子里面有什么）部署提供
# ============================================================================
#
# 用途：把域名下 4 条路径分别转发到前端 / 后端容器（Docker 自定义桥接网络静态 IP）。
#   /2026trip/      -> 前端容器 172.19.0.3:80   （剥离前缀，内层按根 / 提供 SPA）
#   /_wb/           -> 前端容器 172.19.0.3:80   （剥离前缀，同上）
#   /whatsinthebox  -> 后端容器 172.19.0.2:8004 （保留前缀，后端路由挂在此前缀下）
#   /uploads        -> 后端容器 172.19.0.2:8004 （保留前缀，静态上传文件）
#
# TLS 说明：Cloudflare 已终止 TLS（HTTPS 在 Cloudflare 侧结束），本层与容器之间
#   走纯 http，故下方 proxy_pass 均为 http://。如需在本机也启用 https，请自行
#   添加 listen 443 ssl; 与 ssl_certificate / ssl_certificate_key 证书配置，
#   其余 location 内容无需改动。
#
# 安装：本文件写成完整 server 块，可直接软链进 /etc/nginx/conf.d/ 使用：
#   sudo bash deploy/install-host-nginx.sh
# 若你已有自己的 server 块（自有域名 / 证书），请只把下方 4 条 location（含 2 条
# 301）复制进你的 server{} 内，并删除本文件的 server 包裹层。
#
# 注意：本 server 使用 server_name _;（通配占位）。若本机 conf.d 下已存在
#   default_server，请把 _ 换成你的真实域名以免匹配冲突。
#
# 前置条件：容器已按 docker-compose.prod.yml 启动（wib-net 172.19.0.0/16 静态 IP），
#   且本机能路由到 172.19.0.x（宿主机原生 nginx 默认可达 docker bridge 网段）。
# ============================================================================

server {
    listen 80;
    server_name _;

    # ---------- 精确前缀 301：补尾斜杠 ----------
    # 无尾斜杠时浏览器会把 index.html 里的 ./assets 解析到父级路径（错误），
    # 故先 301 到带斜杠形式，保证相对资源基准正确。
    location = /2026trip { return 301 /2026trip/; }
    location = /_wb      { return 301 /_wb/; }

    # ---------- 前端：活动页入口（剥离前缀） ----------
    location /2026trip/ {
        # 深链硬加载兜底：base:'./' 下直接打开 /2026trip/detail/123 时，浏览器会把
        # ./assets 解析为 /2026trip/detail/123/assets/xxx。此处把任意深度的
        # .../assets/... 归一化，并「同时剥离 /2026trip 前缀」→ 直接产出 /assets/xxx。
        #
        # 为何 rewrite 里必须自行剥前缀：nginx 规定当 location 内用 rewrite ... break
        # 改写 URI 后，proxy_pass 的 URI 部分（尾斜杠）会被忽略，改写后的「完整 URI」
        # 原样发往上游。若写成 $1$2 会把 /2026trip/assets/xxx 发给内层 nginx 而 404。
        rewrite ^/2026trip/.*/(assets/.*)$ /$1 break;

        proxy_pass http://172.19.0.3:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 前端：全局页入口（剥离前缀） ----------
    location /_wb/ {
        rewrite ^/_wb/.*/(assets/.*)$ /$1 break;

        proxy_pass http://172.19.0.3:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 后端 API（保留前缀） ----------
    # proxy_pass 不带 URI → 原样传递 /whatsinthebox/... 给后端。
    location ^~ /whatsinthebox {
        proxy_pass http://172.19.0.2:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 上传文件 / 上传接口（保留前缀） ----------
    # client_max_body_size 20m 与后端 MAX_UPLOAD_MB=5 留足余量（外层不应先于
    # 后端拒绝请求，否则用户拿不到后端的友好错误提示）。
    location ^~ /uploads {
        proxy_pass http://172.19.0.2:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }
}
